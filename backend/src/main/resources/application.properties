spring.application.name=BetRadar

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/betradar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=betradar-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.kau4dev.BetRadar.application.dto.RawOddDTO
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kau4dev.BetRadar.application.dto

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.cache.ttl.matches-seconds=30
app.cache.ttl.timeline-seconds=30
app.cache.ttl.opportunities-seconds=15

app.cleanup.cron=0 0 3 * * *
app.cleanup.odds-retention-hours=48

security.jwt.secret=${JWT_SECRET:YmV0cmFkYXItc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNi0zMmI=}
security.jwt.expiration-ms=86400000
security.auth.seed.enabled=${SEED_ENABLED:true}
security.auth.seed.username=${SEED_USERNAME:admin}
security.auth.seed.password=${SEED_PASSWORD:admin12345}

telegram.enabled=true
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.base-url=https://api.telegram.org
telegram.default-chat-id=${TELEGRAM_DEFAULT_CHAT_ID:}
telegram.connect-timeout-ms=3000
telegram.read-timeout-ms=5000
telegram.max-retries=3